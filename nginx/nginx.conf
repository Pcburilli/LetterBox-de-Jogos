events {
    worker_connections 1024;
}

http {
    # Mapeamento dinâmico para negociar WebSockets/HMR corretamente
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Buffer de headers maiores para cookies de sessão e dados do Next.js
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 80;
        server_name _;

        # 1. Roteia chamadas de API para o Flask
        location /api/ {
            proxy_pass http://webapi:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Roteia o frontend Next.js com suporte completo a WebSocket/HMR
        location / {
            resolver 127.0.0.11 valid=10s;
            set $upstream_webapp http://webapp:3000;
            proxy_pass $upstream_webapp;
            
            # Repassa os headers originais de host e IP vindos do Cloudflare
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte a HTTP/1.1 e negociação dinâmica de WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Evita desconexão prematura de conexões longas de socket
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}